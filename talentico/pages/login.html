<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión de TALENTICO CR" />
    <title>TALENTICO CR | Inicio de sesión</title>
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">T</span>
          <p>TALENTICO CR</p>
        </div>
        <div class="login-heading">
          <p class="eyebrow">Bienvenido de vuelta</p>
          <h1 id="login-title">Inicio de sesión</h1>
          <p>Ingresa tus credenciales para continuar.</p>
        </div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
          </div>
          <p id="login-message" class="message" role="alert" aria-live="polite"></p>
          <button id="login-button" type="submit">Iniciar sesión</button>
          <nav class="auth-links" aria-label="Opciones de acceso">
            <a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
            <a href="registro.html">Crear una cuenta</a>
          </nav>
        </form>

        <div class="social-divider" aria-hidden="true">
          <span>o</span>
        </div>

        <button id="facebook-login-btn" class="facebook-btn" type="button">
          <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Continuar con Facebook
        </button>

        <p id="facebook-message" class="message" role="alert" aria-live="polite"></p>
      </section>

      <aside class="login-visual" aria-label="TALENTICO CR conecta talento y oportunidades">
        <div class="visual-content">
          <span class="briefcase" aria-hidden="true"></span>
          <p class="eyebrow">Tu próximo paso profesional</p>
          <h2>Conectamos talento con oportunidades.</h2>
          <p>Organiza y acompaña cada proceso de selección desde un solo lugar.</p>
        </div>
      </aside>
    </main>
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: 'TU_APP_ID_DE_FACEBOOK',
          cookie: true,
          xfbml: true,
          version: 'v19.0',
        });
      };

      (function (d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = 'https://connect.facebook.net/es_LA/sdk.js';
        fjs.parentNode.insertBefore(js, fjs);
      })(document, 'script', 'facebook-jssdk');
    </script>
    <script type="module" src="../src/js/auth.js"></script>
  </body>
</html>
