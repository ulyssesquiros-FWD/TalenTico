<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión de TALENTICO CR" />
    <title>TALENTICO CR | Inicio de sesión</title>
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand" style="justify-content: center; margin-bottom: 1rem;">
          <img src="../logo-completo.png" alt="TalenTico" style="height: 320px; object-fit: contain; max-width: 100%;" />
        </div>
        <div class="login-heading">
          <p class="eyebrow">Bienvenido de vuelta</p>
          <h1 id="login-title">Inicio de sesión</h1>
          <p>Ingresa tus credenciales para continuar.</p>
        </div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
          </div>
          <p id="login-message" class="message" role="alert" aria-live="polite"></p>
          <button id="login-button" type="submit">Iniciar sesión</button>
          <nav class="auth-links" aria-label="Opciones de acceso">
            <a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
            <a href="registro.html">Crear una cuenta</a>
          </nav>
        </form>

        <div class="social-divider" aria-hidden="true">
          <span>o</span>
        </div>

        <button id="google-demo-button" class="google-button" type="button">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.68 1.54 14.98 1 12 1 7.35 1 3.37 3.67 1.39 7.56l3.85 2.99c.92-2.75 3.49-4.51 6.76-4.51z"/>
            <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.28 1.48-1.12 2.74-2.38 3.58l3.7 2.87c2.16-1.99 3.41-4.91 3.41-8.6z"/>
            <path fill="#FBBC05" d="M5.24 14.59c-.24-.71-.38-1.47-.38-2.26s.14-1.55.38-2.26L1.39 7.08C.5 8.86 0 10.87 0 13s.5 4.14 1.39 5.92l3.85-3.33z"/>
            <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.7-2.87c-1.03.69-2.35 1.1-4.26 1.1-3.27 0-5.84-1.76-6.76-4.51L1.39 17.14C3.37 20.33 7.35 23 12 23z"/>
          </svg>
          Continuar con Google (demostración)
        </button>
      </section>

      <aside class="login-visual" aria-label="TALENTICO CR conecta talento y oportunidades">
        <div class="visual-content">
          <span class="briefcase" aria-hidden="true"></span>
          <p class="eyebrow">Tu próximo paso profesional</p>
          <h2>Conectamos talento con oportunidades.</h2>
          <p>Organiza y acompaña cada proceso de selección desde un solo lugar.</p>
        </div>
      </aside>
    </main>
    <script type="module" src="../src/js/auth.js"></script>
  </body>
</html>
