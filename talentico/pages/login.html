<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión de TALENTICO CR" />
    <title>TALENTICO CR | Inicio de sesión</title>
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">T</span>
          <p>TALENTICO CR</p>
        </div>
        <div class="login-heading">
          <p class="eyebrow">Bienvenido de vuelta</p>
          <h1 id="login-title">Inicio de sesión</h1>
          <p>Ingresa tus credenciales para continuar.</p>
        </div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
          </div>
          <p id="login-message" class="message" role="alert" aria-live="polite"></p>
          <button id="login-button" type="submit">Iniciar sesión</button>
          <div class="login-divider"><span>o continúa con</span></div>
          <button id="google-demo-button" class="google-button" type="button">
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#EA4335" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.909c1.702-1.568 2.683-3.875 2.683-6.616Z" />
              <path fill="#4285F4" d="M9 18c2.43 0 4.467-.806 5.957-2.179l-2.91-2.259c-.806.54-1.836.858-3.047.858-2.344 0-4.328-1.584-5.036-3.71H.957v2.332A9 9 0 0 0 9 18Z" />
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.594.102-1.171.282-1.71V4.958H.957A9 9 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" />
              <path fill="#34A853" d="M9 3.58c1.322 0 2.508.455 3.441 1.347l2.582-2.582C13.463.891 11.426 0 9 0a9 9 0 0 0-8.043 4.958L3.964 7.29C4.672 5.164 6.656 3.58 9 3.58Z" />
            </svg>
            Continuar con Google
          </button>
        </form>
      </section>

      <aside class="login-visual" aria-label="TALENTICO CR conecta talento y oportunidades">
        <div class="visual-content">
          <span class="briefcase" aria-hidden="true"></span>
          <p class="eyebrow">Tu próximo paso profesional</p>
          <h2>Conectamos talento con oportunidades.</h2>
          <p>Organiza y acompaña cada proceso de selección desde un solo lugar.</p>
        </div>
      </aside>
    </main>
    <script type="module" src="../src/js/auth.js"></script>
  </body>
</html>
