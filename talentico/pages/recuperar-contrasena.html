<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recuperar contraseña de TALENTICO CR" />
    <title>TALENTICO CR | Recuperar contraseña</title>
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card login-card--form" aria-labelledby="recovery-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">T</span>
          <p>TALENTICO CR</p>
        </div>
        <div class="login-heading">
          <p class="eyebrow">Recupera tu acceso</p>
          <h1 id="recovery-title">¿Olvidaste tu contraseña?</h1>
          <p>Ingresa tu correo y te enviaremos las instrucciones para restablecerla.</p>
        </div>
        <form class="account-form" data-future-api="recovery" novalidate>
          <div class="form-group">
            <label for="recovery-email">Correo electrónico</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required />
          </div>
          <p class="message" role="alert" aria-live="polite"></p>
          <button type="submit">Enviar instrucciones</button>
        </form>
        <p class="auth-footer"><a href="login.html">Volver al inicio de sesión</a></p>
      </section>
      <aside class="login-visual" aria-label="TALENTICO CR conecta talento y oportunidades">
        <div class="visual-content">
          <span class="briefcase" aria-hidden="true"></span>
          <p class="eyebrow">Estamos para ayudarte</p>
          <h2>Recupera el control de tu cuenta.</h2>
          <p>Tu acceso y la seguridad de tu información son importantes para nosotros.</p>
        </div>
      </aside>
    </main>
    <script type="module" src="../src/js/account-forms.js"></script>
  </body>
</html>
