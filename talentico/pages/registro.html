<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registro de cuenta en TALENTICO CR" />
    <title>TALENTICO CR | Crear cuenta</title>
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card login-card--form" aria-labelledby="register-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">T</span>
          <p>TALENTICO CR</p>
        </div>
        <div class="login-heading">
          <p class="eyebrow">Comienza aquí</p>
          <h1 id="register-title">Crear una cuenta</h1>
          <p>Completa tus datos para registrarte en TALENTICO CR.</p>
        </div>
        <form class="account-form" data-future-api="register" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">Nombre</label>
              <input id="first-name" name="firstName" type="text" autocomplete="given-name" required />
            </div>
            <div class="form-group">
              <label for="last-name">Apellido</label>
              <input id="last-name" name="lastName" type="text" autocomplete="family-name" required />
            </div>
          </div>
          <div class="form-group">
            <label for="register-email">Correo electrónico</label>
            <input id="register-email" name="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required />
          </div>
          <div class="form-group">
            <label for="register-username">Usuario</label>
            <input id="register-username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="register-password">Contraseña</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <p class="message" role="alert" aria-live="polite"></p>
          <button type="submit">Crear cuenta</button>
        </form>
        <p class="auth-footer">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
      <aside class="login-visual" aria-label="TALENTICO CR conecta talento y oportunidades">
        <div class="visual-content">
          <span class="briefcase" aria-hidden="true"></span>
          <p class="eyebrow">Construye tu futuro</p>
          <h2>Tu talento merece nuevas oportunidades.</h2>
          <p>Crea tu perfil y mantén organizada tu experiencia profesional.</p>
        </div>
      </aside>
    </main>
    <script type="module" src="../src/js/account-forms.js"></script>
  </body>
</html>
