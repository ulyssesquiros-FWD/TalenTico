<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect - Gestión de Empresas</title>
    <!-- Usa el CSS de Empresas para evitar errores de ruta -->
    <link rel="stylesheet" href="../css/Empresas.css">
</head>
<body>
    <header>
        <h1>Talentico | Empresas Clientes</h1>
        <a href="dashboard.html">Volver al Dashboard</a>
    </header>

    <main class="container">
        <div id="feedback-message" class="hidden"></div>

        <section class="form-section">
            <h2 id="form-title">Agregar Nueva Empresa</h2>
            <form id="empresa-form">
                <input type="hidden" id="empresa-id">
                <label for="company-userId">ID de Usuario Cliente:</label>
                <input type="number" id="company-userId" placeholder="Ej. 12" required>
                
                <label for="total-products">Total Contrataciones:</label>
                <input type="number" id="total-products" placeholder="Ej. 5" required>

                <button type="submit" id="btn-submit">Guardar Empresa</button>
                <button type="button" id="btn-cancel" class="hidden">Cancelar</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Lista de Empresas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID Cart</th>
                        <th>User ID</th>
                        <th>Total Productos</th>
                        <th>Monto Total</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="empresas-tbody">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal de Confirmación de Eliminación -->
 <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>¿Confirmar eliminación?</h3>
        <p>Esta acción eliminará la empresa seleccionada de la lista. ¿Deseas continuar?</p>
        <div class="modal-actions">
            <button id="btn-modal-cancel" class="btn-secondary">Cancelar</button>
            <button id="btn-modal-confirm" class="btn-danger">Eliminar</button>
        </div>
    </div>
 </div>

    <!-- Quita type="module" e importa empresas.js directamente sin depender de C1 -->
    <script src="../js/Empresas.js"></script>
</body>
</html>
