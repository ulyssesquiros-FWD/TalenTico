<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect - Gestión de Postulaciones</title>
    <link rel="stylesheet" href="../css/Postulaciones.css">
</head>
<body>
    <header>
        <h1>Talentico | Postulaciones de Candidatos</h1>
        <a href="dashboard.html">Volver al Dashboard</a>
    </header>

    <main class="container">
        <div id="feedback-message" class="hidden"></div>

        <section class="form-section">
            <h2 id="form-title">Registrar Nueva Postulación</h2>
            <form id="postulacion-form">
                <input type="hidden" id="postulacion-id">
                
                <label for="post-title">Título de la Postulación:</label>
                <input type="text" id="post-title" placeholder="Ej. Postulación a Desarrollador Frontend" required>
                
                <label for="post-body">Resumen / Detalle:</label>
                <textarea id="post-body" rows="3" placeholder="Detalles de la postulación..." required></textarea>

                <label for="post-userId">ID del Candidato (User ID):</label>
                <input type="number" id="post-userId" placeholder="Ej. 5" required>

                <button type="submit" id="btn-submit">Guardar Postulación</button>
                <button type="button" id="btn-cancel" class="hidden">Cancelar</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Listado de Postulaciones</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID Post</th>
                        <th>Candidato ID</th>
                        <th>Título</th>
                        <th>Reacciones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="postulaciones-tbody">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal de Confirmación de Eliminación -->
 <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>¿Confirmar eliminación?</h3>
        <p>Esta acción eliminará la postulación seleccionada. ¿Deseas continuar?</p>
        <div class="modal-actions">
            <button id="btn-modal-cancel" class="btn-secondary">Cancelar</button>
            <button id="btn-modal-confirm" class="btn-danger">Eliminar.</button>
        </div>
    </div>
 </div>

    <script src="../js/Postulaciones.js"></script>
</body>
</html>
